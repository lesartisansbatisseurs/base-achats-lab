<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base Achats &amp; Commercial — LAB</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23787372'/%3E%3Ctext x='32' y='42' font-size='30' text-anchor='middle' fill='%231D9ED9' font-family='Arial' font-weight='bold'%3EA%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --taupe:#787372;
    --taupe-dark:#5f5b5a;
    --cyan:#1D9ED9;
    --cyan-dark:#157bab;
    --bg:#f4f3f2;
    --panel:#ffffff;
    --border:#e3e0df;
    --text:#2b2928;
    --text-muted:#736f6e;
    --danger:#d9483a;
    --success:#2fa86a;
    --radius:10px;
    --shadow:0 2px 10px rgba(0,0,0,.06);
  }
  [data-theme="dark"]{
    --bg:#1c1b1a;
    --panel:#262423;
    --border:#3a3735;
    --text:#f1efee;
    --text-muted:#a8a3a1;
    --shadow:0 2px 14px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    transition:background .2s,color .2s;
  }
  a{color:inherit;}
  header{
    background:var(--taupe);
    color:#fff;
    padding:14px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    position:sticky;
    top:0;
    z-index:50;
    box-shadow:var(--shadow);
  }
  header .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  header .brand .logo{
    width:36px;height:36px;border-radius:8px;
    background:var(--cyan);
    display:flex;align-items:center;justify-content:center;
    font-weight:bold;font-size:18px;
  }
  header h1{
    font-size:17px;
    margin:0;
    font-weight:600;
    line-height:1.2;
  }
  header .subtitle{
    font-size:11.5px;
    opacity:.85;
    margin:0;
  }
  header .actions{
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
  }
  .icon-btn{
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.25);
    color:#fff;
    width:36px;height:36px;
    border-radius:8px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
  }
  .icon-btn:hover{background:rgba(255,255,255,.22);}
  .btn{
    border:none;
    border-radius:8px;
    padding:9px 16px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .btn-primary{background:var(--cyan);color:#fff;}
  .btn-primary:hover{background:var(--cyan-dark);}
  .btn-ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);}
  .btn-ghost:hover{background:rgba(255,255,255,.22);}
  .btn-secondary{background:var(--panel);color:var(--text);border:1px solid var(--border);}
  .btn-secondary:hover{border-color:var(--cyan);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-danger:hover{opacity:.9;}
  .btn-sm{padding:6px 10px;font-size:12px;border-radius:6px;}

  .layout{
    display:flex;
    max-width:1400px;
    margin:0 auto;
    align-items:flex-start;
  }
  aside{
    width:230px;
    flex-shrink:0;
    padding:20px 14px;
    position:sticky;
    top:70px;
    max-height:calc(100vh - 90px);
    overflow-y:auto;
  }
  aside h3{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--text-muted);
    margin:18px 8px 8px;
  }
  aside h3:first-child{margin-top:0;}
  .lot-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 10px;
    border-radius:8px;
    cursor:pointer;
    font-size:13.5px;
    margin-bottom:2px;
  }
  .lot-item:hover{background:var(--panel);}
  .lot-item.active{background:var(--cyan);color:#fff;}
  .lot-item .count{
    font-size:11px;
    background:rgba(120,115,114,.15);
    border-radius:20px;
    padding:1px 7px;
  }
  .lot-item.active .count{background:rgba(255,255,255,.25);}

  main{
    flex:1;
    padding:20px 22px 60px;
    min-width:0;
  }
  .toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    margin-bottom:16px;
  }
  .search-box{
    flex:1;
    min-width:220px;
    position:relative;
  }
  .search-box input{
    width:100%;
    padding:10px 12px 10px 36px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    font-size:14px;
  }
  .search-box input:focus{outline:none;border-color:var(--cyan);}
  .search-box::before{
    content:"🔍";
    position:absolute;
    left:11px;top:50%;
    transform:translateY(-50%);
    font-size:13px;
    opacity:.6;
  }
  select.sort-select{
    padding:10px 12px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    font-size:13.5px;
  }

  .stats-row{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px;
    margin-bottom:18px;
  }
  .stat-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
    box-shadow:var(--shadow);
  }
  .stat-card .num{font-size:22px;font-weight:700;color:var(--cyan);}
  .stat-card .label{font-size:12px;color:var(--text-muted);margin-top:2px;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
    gap:14px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    box-shadow:var(--shadow);
    cursor:pointer;
    transition:transform .1s, border-color .15s;
  }
  .card:hover{border-color:var(--cyan);transform:translateY(-1px);}
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
  }
  .card h4{
    margin:0 0 4px;
    font-size:15.5px;
  }
  .card .contact-line{
    font-size:12.5px;
    color:var(--text-muted);
    margin:0;
  }
  .tags{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin:10px 0 8px;
  }
  .tag{
    font-size:10.5px;
    background:rgba(29,158,217,.12);
    color:var(--cyan-dark);
    border-radius:20px;
    padding:3px 9px;
    font-weight:600;
    white-space:nowrap;
  }
  [data-theme="dark"] .tag{color:#7fd0f5;background:rgba(29,158,217,.18);}
  .card-details{
    font-size:12.5px;
    color:var(--text-muted);
    display:flex;
    flex-direction:column;
    gap:3px;
    margin-top:6px;
    border-top:1px solid var(--border);
    padding-top:8px;
  }
  .card-details span b{color:var(--text);font-weight:600;}
  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--text-muted);
  }
  .empty-state .big{font-size:38px;margin-bottom:8px;}

  /* Modal */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(20,18,17,.55);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px;
    z-index:100;
    overflow-y:auto;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--panel);
    border-radius:12px;
    width:100%;
    max-width:560px;
    padding:22px 24px 24px;
    box-shadow:0 10px 40px rgba(0,0,0,.3);
  }
  .modal h2{margin:0 0 16px;font-size:18px;}
  .field{margin-bottom:13px;}
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    margin-bottom:5px;
    color:var(--text-muted);
  }
  .field input, .field textarea, .field select{
    width:100%;
    padding:9px 11px;
    border-radius:7px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    font-size:13.5px;
    font-family:inherit;
  }
  .field input:focus, .field textarea:focus, .field select:focus{outline:none;border-color:var(--cyan);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .tag-input-box{
    border:1px solid var(--border);
    border-radius:7px;
    padding:6px 8px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    background:var(--bg);
  }
  .tag-input-box input{
    border:none;background:transparent;flex:1;min-width:120px;padding:4px;font-size:13px;color:var(--text);
  }
  .tag-input-box input:focus{outline:none;}
  .chip{
    background:var(--cyan);
    color:#fff;
    font-size:11.5px;
    border-radius:20px;
    padding:4px 8px 4px 10px;
    display:flex;align-items:center;gap:5px;
    font-weight:600;
  }
  .chip button{
    background:none;border:none;color:#fff;cursor:pointer;font-size:13px;line-height:1;padding:0;opacity:.85;
  }
  .chip button:hover{opacity:1;}
  datalist{}
  .modal-actions{
    display:flex;
    justify-content:space-between;
    margin-top:18px;
    gap:10px;
  }
  .modal-actions .right{display:flex;gap:8px;}

  .toast{
    position:fixed;
    bottom:20px;right:20px;
    background:var(--text);
    color:var(--bg);
    padding:11px 18px;
    border-radius:8px;
    font-size:13.5px;
    box-shadow:0 4px 16px rgba(0,0,0,.25);
    z-index:200;
    opacity:0;
    transform:translateY(10px);
    transition:opacity .2s, transform .2s;
    pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateY(0);}
  .toast.error{background:var(--danger);color:#fff;}

  .status-dot{
    width:8px;height:8px;border-radius:50%;
    background:#f2c94c;
    display:inline-block;
    margin-right:6px;
  }
  .status-dot.ok{background:var(--success);}
  .status-dot.error{background:var(--danger);}
  .sync-label{font-size:11.5px;opacity:.85;display:flex;align-items:center;}

  @media(max-width:820px){
    .layout{flex-direction:column;}
    aside{
      width:100%;
      position:static;
      max-height:none;
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      padding:14px 16px 0;
    }
    aside h3{display:none;}
    .lot-item{margin-bottom:0;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">A</div>
    <div>
      <h1>Base Achats &amp; Commercial</h1>
      <p class="subtitle">Les Artisans Bâtisseurs — Fournisseurs &amp; sous-traitants</p>
    </div>
  </div>
  <div class="actions">
    <span class="sync-label"><span class="status-dot" id="syncDot"></span><span id="syncText">Connexion…</span></span>
    <button class="icon-btn" id="themeToggle" title="Changer le thème">🌙</button>
    <button class="btn btn-ghost" id="exportBtn">⬇ Export CSV</button>
    <button class="btn btn-primary" id="addBtn">+ Ajouter</button>
  </div>
</header>

<div class="layout">
  <aside>
    <h3>Lots</h3>
    <div id="lotList"></div>
  </aside>

  <main>
    <div class="stats-row" id="statsRow"></div>

    <div class="toolbar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Rechercher (entreprise, contact, ville, lot…)">
      </div>
      <select class="sort-select" id="sortSelect">
        <option value="nom-asc">Nom (A→Z)</option>
        <option value="nom-desc">Nom (Z→A)</option>
        <option value="recent">Plus récents</option>
        <option value="ville">Ville</option>
      </select>
    </div>

    <div class="grid" id="grid"></div>
    <div class="empty-state" id="emptyState" style="display:none">
      <div class="big">📇</div>
      <p>Aucun fournisseur / sous-traitant pour ce filtre.</p>
    </div>
  </main>
</div>

<!-- Modal Ajout/Edition -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Ajouter un fournisseur / sous-traitant</h2>
    <form id="fournisseurForm">
      <div class="field">
        <label>Nom de l'entreprise *</label>
        <input type="text" id="f_nom" required placeholder="Ex : Dupont Plomberie SARL">
      </div>

      <div class="field">
        <label>Lot(s) *</label>
        <div class="tag-input-box" id="tagBox">
          <input type="text" id="lotInput" list="lotSuggestions" placeholder="Taper un lot puis Entrée">
        </div>
        <datalist id="lotSuggestions">
          <option value="Terrassement / VRD">
          <option value="Gros Œuvre / Maçonnerie">
          <option value="Charpente">
          <option value="Couverture / Étanchéité">
          <option value="Menuiseries extérieures">
          <option value="Menuiseries intérieures">
          <option value="Plâtrerie / Isolation">
          <option value="Peinture / Revêtements muraux">
          <option value="Carrelage / Faïence">
          <option value="Sols souples / Parquet">
          <option value="Électricité">
          <option value="Plomberie / Sanitaire">
          <option value="Chauffage / Ventilation / Climatisation">
          <option value="Ascenseur">
          <option value="Serrurerie / Métallerie">
          <option value="Espaces verts / Paysagisme">
          <option value="Nettoyage / Fin de chantier">
        </datalist>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Contact référent</label>
          <input type="text" id="f_contact" placeholder="Nom du contact">
        </div>
        <div class="field">
          <label>Téléphone</label>
          <input type="tel" id="f_telephone" placeholder="06 12 34 56 78">
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Email</label>
          <input type="email" id="f_email" placeholder="contact@entreprise.fr">
        </div>
        <div class="field">
          <label>Site web</label>
          <input type="text" id="f_siteweb" placeholder="www.entreprise.fr">
        </div>
      </div>

      <div class="field">
        <label>Adresse</label>
        <input type="text" id="f_adresse" placeholder="N° et rue">
      </div>

      <div class="field-row">
        <div class="field">
          <label>Code postal</label>
          <input type="text" id="f_cp" placeholder="78630">
        </div>
        <div class="field">
          <label>Ville</label>
          <input type="text" id="f_ville" placeholder="Orgeval">
        </div>
      </div>

      <div class="field">
        <label>Notes / commentaires</label>
        <textarea id="f_notes" rows="3" placeholder="Qualité, tarifs, délais, historique de collaboration…"></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-danger" id="deleteBtn" style="display:none">Supprimer</button>
        <div class="right">
          <button type="button" class="btn btn-secondary" id="cancelBtn">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   Base Achats & Commercial — LAB
   Fichier autonome (aucune dépendance externe / aucun build)
   Backend : Firebase Realtime Database — API REST (fetch)
   Projet Firebase : base-achat-sst-lab (europe-west1)
   ========================================================= */

const FIREBASE_DB_URL = "https://base-achat-sst-lab-default-rtdb.europe-west1.firebasedatabase.app";
const DATA_PATH = "fournisseurs";

let fournisseurs = {};      // { id: {...} }
let currentLotFilter = "__ALL__";
let currentSearch = "";
let currentSort = "nom-asc";
let editingId = null;
let currentTags = [];
let pollTimer = null;

// ---------- Utilitaires ----------
function $(sel){ return document.querySelector(sel); }
function esc(str){
  return (str || "").toString().replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function showToast(msg, isError){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.toggle('error', !!isError);
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(() => t.classList.remove('show'), 2600);
}
function setSyncStatus(state, label){
  const dot = $('#syncDot');
  const text = $('#syncText');
  dot.className = 'status-dot ' + (state === 'ok' ? 'ok' : state === 'error' ? 'error' : '');
  text.textContent = label;
}

// ---------- Firebase REST ----------
async function fbGet(path){
  const res = await fetch(`${FIREBASE_DB_URL}/${path}.json`);
  if(!res.ok) throw new Error('Erreur lecture Firebase (' + res.status + ')');
  return res.json();
}
async function fbPost(path, data){
  const res = await fetch(`${FIREBASE_DB_URL}/${path}.json`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(data)
  });
  if(!res.ok) throw new Error('Erreur écriture Firebase (' + res.status + ')');
  return res.json(); // { name: "<newId>" }
}
async function fbPut(path, data){
  const res = await fetch(`${FIREBASE_DB_URL}/${path}.json`, {
    method: 'PUT',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(data)
  });
  if(!res.ok) throw new Error('Erreur mise à jour Firebase (' + res.status + ')');
  return res.json();
}
async function fbDelete(path){
  const res = await fetch(`${FIREBASE_DB_URL}/${path}.json`, { method: 'DELETE' });
  if(!res.ok) throw new Error('Erreur suppression Firebase (' + res.status + ')');
  return res.json();
}

async function loadData(silent){
  try{
    if(!silent) setSyncStatus('', 'Synchronisation…');
    const data = await fbGet(DATA_PATH);
    fournisseurs = data || {};
    setSyncStatus('ok', 'Synchronisé');
    render();
  }catch(err){
    console.error(err);
    setSyncStatus('error', 'Hors ligne / erreur');
    if(!silent) showToast("Impossible de joindre Firebase — vérifie ta connexion ou les règles de la base.", true);
  }
}

// ---------- Rendu ----------
function getAllLots(){
  const set = new Set();
  Object.values(fournisseurs).forEach(f => (f.lots||[]).forEach(l => set.add(l)));
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'fr'));
}

function renderLotList(){
  const lots = getAllLots();
  const counts = {};
  lots.forEach(l => counts[l] = 0);
  Object.values(fournisseurs).forEach(f => (f.lots||[]).forEach(l => { counts[l] = (counts[l]||0)+1; }));

  const total = Object.keys(fournisseurs).length;
  let html = `<div class="lot-item ${currentLotFilter==='__ALL__'?'active':''}" data-lot="__ALL__">
      <span>Tous</span><span class="count">${total}</span></div>`;
  lots.forEach(l => {
    html += `<div class="lot-item ${currentLotFilter===l?'active':''}" data-lot="${esc(l)}">
      <span>${esc(l)}</span><span class="count">${counts[l]}</span></div>`;
  });
  $('#lotList').innerHTML = html;
  $('#lotList').querySelectorAll('.lot-item').forEach(el => {
    el.addEventListener('click', () => {
      currentLotFilter = el.dataset.lot;
      render();
    });
  });
}

function renderStats(){
  const total = Object.keys(fournisseurs).length;
  const lotsCount = getAllLots().length;
  const villes = new Set(Object.values(fournisseurs).map(f => (f.ville||'').trim().toLowerCase()).filter(Boolean));
  $('#statsRow').innerHTML = `
    <div class="stat-card"><div class="num">${total}</div><div class="label">Fournisseurs / sous-traitants</div></div>
    <div class="stat-card"><div class="num">${lotsCount}</div><div class="label">Lots référencés</div></div>
    <div class="stat-card"><div class="num">${villes.size}</div><div class="label">Villes couvertes</div></div>
  `;
}

function getFilteredSorted(){
  let list = Object.entries(fournisseurs).map(([id, f]) => ({ id, ...f }));

  if(currentLotFilter !== '__ALL__'){
    list = list.filter(f => (f.lots||[]).includes(currentLotFilter));
  }
  if(currentSearch.trim()){
    const q = currentSearch.trim().toLowerCase();
    list = list.filter(f =>
      (f.nom||'').toLowerCase().includes(q) ||
      (f.contact||'').toLowerCase().includes(q) ||
      (f.ville||'').toLowerCase().includes(q) ||
      (f.email||'').toLowerCase().includes(q) ||
      (f.lots||[]).some(l => l.toLowerCase().includes(q))
    );
  }
  switch(currentSort){
    case 'nom-asc': list.sort((a,b)=> (a.nom||'').localeCompare(b.nom||'','fr')); break;
    case 'nom-desc': list.sort((a,b)=> (b.nom||'').localeCompare(a.nom||'','fr')); break;
    case 'ville': list.sort((a,b)=> (a.ville||'').localeCompare(b.ville||'','fr')); break;
    case 'recent': list.sort((a,b)=> (b.dateAjout||0) - (a.dateAjout||0)); break;
  }
  return list;
}

function renderGrid(){
  const list = getFilteredSorted();
  $('#emptyState').style.display = list.length ? 'none' : 'block';
  $('#grid').innerHTML = list.map(f => `
    <div class="card" data-id="${esc(f.id)}">
      <div class="card-top">
        <h4>${esc(f.nom)}</h4>
      </div>
      ${f.contact ? `<p class="contact-line">👤 ${esc(f.contact)}</p>` : ''}
      <div class="tags">${(f.lots||[]).map(l => `<span class="tag">${esc(l)}</span>`).join('')}</div>
      <div class="card-details">
        ${f.telephone ? `<span>📞 <b>${esc(f.telephone)}</b></span>` : ''}
        ${f.email ? `<span>✉️ ${esc(f.email)}</span>` : ''}
        ${(f.ville || f.cp) ? `<span>📍 ${esc(f.cp||'')} ${esc(f.ville||'')}</span>` : ''}
      </div>
    </div>
  `).join('');
  $('#grid').querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', () => openModal(el.dataset.id));
  });
}

function render(){
  renderLotList();
  renderStats();
  renderGrid();
}

// ---------- Modal / Formulaire ----------
function renderTags(){
  const box = $('#tagBox');
  box.querySelectorAll('.chip').forEach(c => c.remove());
  const input = $('#lotInput');
  currentTags.forEach((tag, i) => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.innerHTML = `${esc(tag)} <button type="button" data-i="${i}">✕</button>`;
    box.insertBefore(chip, input);
  });
  box.querySelectorAll('.chip button').forEach(btn => {
    btn.addEventListener('click', () => {
      currentTags.splice(Number(btn.dataset.i), 1);
      renderTags();
    });
  });
}

function addTagFromInput(){
  const input = $('#lotInput');
  const val = input.value.trim();
  if(val && !currentTags.includes(val)){
    currentTags.push(val);
    renderTags();
  }
  input.value = '';
}

function openModal(id){
  editingId = id || null;
  const f = id ? fournisseurs[id] : null;
  $('#modalTitle').textContent = f ? 'Modifier le fournisseur / sous-traitant' : 'Ajouter un fournisseur / sous-traitant';
  $('#f_nom').value = f?.nom || '';
  $('#f_contact').value = f?.contact || '';
  $('#f_telephone').value = f?.telephone || '';
  $('#f_email').value = f?.email || '';
  $('#f_siteweb').value = f?.siteweb || '';
  $('#f_adresse').value = f?.adresse || '';
  $('#f_cp').value = f?.cp || '';
  $('#f_ville').value = f?.ville || '';
  $('#f_notes').value = f?.notes || '';
  currentTags = f?.lots ? [...f.lots] : [];
  renderTags();
  $('#deleteBtn').style.display = f ? 'inline-flex' : 'none';
  $('#modalOverlay').classList.add('open');
  $('#f_nom').focus();
}

function closeModal(){
  $('#modalOverlay').classList.remove('open');
  editingId = null;
  currentTags = [];
}

async function handleSubmit(e){
  e.preventDefault();
  addTagFromInput();
  const nom = $('#f_nom').value.trim();
  if(!nom){ showToast('Le nom de l\'entreprise est obligatoire.', true); return; }
  if(currentTags.length === 0){ showToast('Ajoute au moins un lot.', true); return; }

  const payload = {
    nom,
    lots: currentTags,
    contact: $('#f_contact').value.trim(),
    telephone: $('#f_telephone').value.trim(),
    email: $('#f_email').value.trim(),
    siteweb: $('#f_siteweb').value.trim(),
    adresse: $('#f_adresse').value.trim(),
    cp: $('#f_cp').value.trim(),
    ville: $('#f_ville').value.trim(),
    notes: $('#f_notes').value.trim(),
    dateAjout: editingId ? (fournisseurs[editingId]?.dateAjout || Date.now()) : Date.now(),
    dateMaj: Date.now()
  };

  const submitBtn = e.target.querySelector('button[type="submit"]');
  submitBtn.disabled = true;
  try{
    if(editingId){
      await fbPut(`${DATA_PATH}/${editingId}`, payload);
      fournisseurs[editingId] = payload;
      showToast('Fiche mise à jour ✓');
    } else {
      const res = await fbPost(DATA_PATH, payload);
      fournisseurs[res.name] = payload;
      showToast('Fournisseur ajouté ✓');
    }
    closeModal();
    render();
  }catch(err){
    console.error(err);
    showToast("Échec de l'enregistrement — vérifie ta connexion.", true);
  }finally{
    submitBtn.disabled = false;
  }
}

async function handleDelete(){
  if(!editingId) return;
  const f = fournisseurs[editingId];
  if(!confirm(`Supprimer "${f?.nom || 'ce fournisseur'}" ? Cette action est irréversible.`)) return;
  try{
    await fbDelete(`${DATA_PATH}/${editingId}`);
    delete fournisseurs[editingId];
    showToast('Fournisseur supprimé');
    closeModal();
    render();
  }catch(err){
    console.error(err);
    showToast('Échec de la suppression.', true);
  }
}

// ---------- Export CSV ----------
function exportCSV(){
  const rows = [
    ['Nom','Lots','Contact','Téléphone','Email','Site web','Adresse','Code postal','Ville','Notes']
  ];
  Object.values(fournisseurs).forEach(f => {
    rows.push([
      f.nom||'', (f.lots||[]).join(' | '), f.contact||'', f.telephone||'',
      f.email||'', f.siteweb||'', f.adresse||'', f.cp||'', f.ville||'', (f.notes||'').replace(/\n/g,' ')
    ]);
  });
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `base-achats-lab-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// ---------- Thème ----------
function initTheme(){
  let theme = 'light';
  try{ theme = localStorage.getItem('lab-achats-theme') || 'light'; }catch(e){}
  document.documentElement.setAttribute('data-theme', theme);
  $('#themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  $('#themeToggle').textContent = next === 'dark' ? '☀️' : '🌙';
  try{ localStorage.setItem('lab-achats-theme', next); }catch(e){}
}

// ---------- Init ----------
function init(){
  initTheme();

  $('#addBtn').addEventListener('click', () => openModal(null));
  $('#cancelBtn').addEventListener('click', closeModal);
  $('#modalOverlay').addEventListener('click', (e) => { if(e.target.id === 'modalOverlay') closeModal(); });
  $('#fournisseurForm').addEventListener('submit', handleSubmit);
  $('#deleteBtn').addEventListener('click', handleDelete);
  $('#themeToggle').addEventListener('click', toggleTheme);
  $('#exportBtn').addEventListener('click', exportCSV);

  $('#lotInput').addEventListener('keydown', (e) => {
    if(e.key === 'Enter' || e.key === ','){
      e.preventDefault();
      addTagFromInput();
    }
  });
  $('#lotInput').addEventListener('blur', () => addTagFromInput());

  $('#searchInput').addEventListener('input', (e) => { currentSearch = e.target.value; renderGrid(); });
  $('#sortSelect').addEventListener('change', (e) => { currentSort = e.target.value; renderGrid(); });

  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') closeModal();
  });

  loadData();
  // Rafraîchissement périodique pour rester synchronisé entre utilisateurs (pas de socket temps réel via REST)
  pollTimer = setInterval(() => loadData(true), 20000);
  window.addEventListener('focus', () => loadData(true));
}

document.addEventListener('DOMContentLoaded', init);
</script>
